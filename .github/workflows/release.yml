name: Release

# Runs when a version tag is pushed (`pnpm release patch` creates and pushes one).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Optional: AMO API credentials (addons.mozilla.org → Tools → Manage API Keys), saved as repository secrets.
  # With them, the Firefox build is signed (unlisted) so it installs permanently in any Firefox.
  AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
  AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      # Building the dictionaries downloads ~1.6 GB from kaikki.org, so reuse them
      # until the build script changes.
      - name: Restore dictionaries
        id: dict
        uses: actions/cache@v4
        with:
          path: public/dict
          key: dict-${{ hashFiles('scripts/build-dictionary.mjs') }}
      - name: Build dictionaries
        if: steps.dict.outputs.cache-hit != 'true'
        run: pnpm build:dict

      - run: pnpm check
      - run: pnpm zip
      # Also writes a sources zip, which addons.mozilla.org asks for when signing bundled code.
      - run: pnpm zip:firefox

      - name: Sign the Firefox build
        if: env.AMO_API_KEY != ''
        run: |
          pnpm dlx web-ext@8 sign \
            --channel unlisted \
            --source-dir .output/firefox-mv3 \
            --upload-source-code .output/*-sources.zip \
            --artifacts-dir .output/signed \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --approval-timeout 1800000
          for f in .output/signed/*.xpi; do mv "$f" ".output/turbotranslate-${GITHUB_REF_NAME#v}-firefox.xpi"; done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" .output/*-chrome.zip .output/*-firefox.zip .output/*-firefox.xpi \
            --title "TurboTranslate $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
